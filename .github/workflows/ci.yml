name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Check formatting
      run: cargo fmt --check
      
    - name: Run tests
      run: cargo test --verbose